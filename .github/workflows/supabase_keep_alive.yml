name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 0 */5 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Check and Ping Supabase
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SB_URL" ]; then
            echo "Fehler: SUPABASE_URL Secret ist leer oder nicht gefunden!"
            exit 1
          fi
          
          curl -X GET "$SB_URL/rest/v1/mitglieder?select=count" \
          -H "apikey: $SB_KEY" \
          -H "Authorization: Bearer $SB_KEY"
