name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 0 */5 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Trim and Ping Supabase
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # Entfernt eventuelle Leerzeichen oder Zeilenumbrüche aus den Secrets
          CLEAN_URL=$(echo "$SB_URL" | xargs)
          CLEAN_KEY=$(echo "$SB_KEY" | xargs)
          
          echo "Sende Ping an Supabase..."
          
          curl -s -X GET "${CLEAN_URL}/rest/v1/mitglieder?select=count" \
          -H "apikey: ${CLEAN_KEY}" \
          -H "Authorization: Bearer ${CLEAN_KEY}"
