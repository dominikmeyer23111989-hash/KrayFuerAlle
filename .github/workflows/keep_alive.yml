name: App Keep-Alive

on:
  schedule:
    # Läuft alle 3 Tage um 00:00 Uhr
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          # -L folgt dem Redirect, -s unterdrückt das Textgeplänkel, -o /dev/null verwirft den HTML-Inhalt
          curl -s -L -o /dev/null https://krayfueralle.streamlit.app
