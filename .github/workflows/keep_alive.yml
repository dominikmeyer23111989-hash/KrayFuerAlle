name: App Keep-Alive

on:
  # Läuft alle 3 Tage um 00:00 Uhr (schützt vor dem Inaktivitäts-Schlaf)
  schedule:
    - cron: '0 0 */3 * *'
  # Ermöglicht auch das manuelle Starten über den GitHub-Tab "Actions"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -I https://krayfueralle.streamlit.app
