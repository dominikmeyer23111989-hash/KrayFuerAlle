name: App Keep-Alive

on:
  schedule:
    # Läuft alle 3 Tage um 00:00 Uhr
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          # --max-redirs 2 bricht die Weiterleitung nach maximal 2 Schritten ab, 
          # wodurch die App aus dem Schlaf geholt wird, ohne in die Endlosschleife zu geraten.
          curl -s -L --max-redirs 2 -o /dev/null https://krayfueralle.streamlit.app || true
